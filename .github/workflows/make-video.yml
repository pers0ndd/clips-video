name: make-video

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug клипа (из ссылки на клип)"
        required: true
      streamer:
        description: "Ник стримера"
        required: true
      chat_id:
        description: "ID вашего чата в Telegram"
        required: true
      text:
        description: "Текст на видео (можно оставить пустым)"
        required: false
        default: ""
      layout:
        description: "Раскладка: auto (камера найдётся сама), split (камера + игра) или irl (4:3)"
        required: false
        type: choice
        default: auto
        options:
          - auto
          - split
          - irl
      profile:
        description: "Профиль камеры (для split)"
        required: false
        default: default

jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg, fonts and OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python3 -m pip install --quiet --break-system-packages opencv-python-headless \
            || sudo apt-get install -y python3-opencv

      - name: Make and send video
        env:
          SLUG: ${{ inputs.slug }}
          STREAMER: ${{ inputs.streamer }}
          CHAT_ID: ${{ inputs.chat_id }}
          TEXT: ${{ inputs.text }}
          LAYOUT: ${{ inputs.layout }}
          PROFILE: ${{ inputs.profile }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python3 make_video.py
