name: build-exe

on:
  workflow_dispatch:
  push:
    paths:
      - clip_search.py

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --quiet pyinstaller

      - name: Check that the window opens
        continue-on-error: true
        run: python clip_search.py --selftest

      - name: Build clip_search.exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name clip_search clip_search.py

      - uses: actions/upload-artifact@v4
        with:
          name: clip_search
          path: dist/clip_search.exe
          retention-days: 30
